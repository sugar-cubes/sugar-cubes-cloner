name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the version comes from the Git tags
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        # the other JDKs of the build are provisioned by the toolchain resolver
        run: ./gradlew build
      - name: Publish snapshot
        # <tag>-<commits since the tag>-SNAPSHOT to GitHub Packages and the Central snapshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository publishAggregationToCentralSnapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
