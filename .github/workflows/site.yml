name: site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Javadoc
        # the other JDKs of the build are provisioned by the toolchain resolver
        run: ./gradlew :sugar-cubes-cloner:javadoc
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Site
        run: |
          pip install zensical==0.1.3
          zensical build --clean --strict
          cp -r sugar-cubes-cloner/build/docs/javadoc site/api
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
