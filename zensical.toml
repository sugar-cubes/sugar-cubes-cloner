[project]
site_name = "Sugar Cubes Cloner"
site_description = "Deep cloning of any Java objects"
site_author = "Maxim Butov"
site_url = "https://sugar-cubes.github.io/sugar-cubes-cloner/"
copyright = "Copyright &copy; 2017-2026 Maxim Butov, Apache License 2.0"
repo_url = "https://github.com/sugar-cubes/sugar-cubes-cloner"
repo_name = "sugar-cubes/sugar-cubes-cloner"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Modes" = "modes.md" },
  { "JDK types" = "jdk-types.md" },
  { "Toolsets" = "toolsets.md" },
  { "Performance" = "performance.md" },
  { "Build tools" = "build-tools.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Changelog" = "https://github.com/sugar-cubes/sugar-cubes-cloner/blob/main/CHANGELOG.md" },
  # the Javadoc is copied to api/ after the site is built
  { "API reference" = "api/" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
